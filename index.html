<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta (GEO/SEO) — baked into raw HTML so crawlers and AI answer
         engines read real content before JavaScript runs. -->
    <title>OpenI Hub — AI Open Innovation Marketplace | Find Startups & Partners</title>
    <meta name="description" content="AI-powered open innovation marketplace. Search 575,000+ startups in plain English, post challenges, and connect with corporates, investors and academia." />
    <link rel="canonical" href="https://www.openi.ai/" />

    <!-- Open Graph (link previews on LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenI Hub" />
    <meta property="og:title" content="OpenI Hub — AI Open Innovation Marketplace" />
    <meta property="og:description" content="Search 575,000+ startups, post challenges, and connect directly with corporates, investors, government and academia. ISO 27001 certified. Free to start." />
    <meta property="og:url" content="https://www.openi.ai/" />
    <meta property="og:image" content="https://www.openi.ai/openi-logo.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenI Hub — AI Open Innovation Marketplace" />
    <meta name="twitter:description" content="Search 575,000+ startups, post challenges, and connect directly. ISO 27001 certified. Free to start." />
    <meta name="twitter:image" content="https://www.openi.ai/openi-logo.png" />

    <!-- Structured data — lets AI engines classify OpenI correctly. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OpenI Hub",
      "legalName": "OpenI Partners LLP",
      "url": "https://www.openi.ai",
      "logo": "https://www.openi.ai/openi-logo.png",
      "description": "AI-powered open innovation marketplace connecting startups with corporates, investors, government and academia. Search 575,000+ startups, post challenges, and connect directly. ISO/IEC 27001:2022 certified.",
      "sameAs": [
        "https://www.linkedin.com/company/openi-partners/",
        "https://x.com/OpenIPartners"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OpenI Hub",
      "url": "https://www.openi.ai",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered open innovation marketplace. Search 575,000+ startups in plain English using an 8-vector AI evaluation framework, post innovation challenges, and connect with corporates, investors, government and academia.",
      "offers": [
        { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "INR" },
        { "@type": "Offer", "name": "Pro", "price": "2499", "priceCurrency": "INR" },
        { "@type": "Offer", "name": "Enterprise", "price": "9999", "priceCurrency": "INR" }
      ],
      "publisher": { "@type": "Organization", "name": "OpenI Partners LLP" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
