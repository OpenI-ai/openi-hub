<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons / browser-tab icon (OpenI "oi" mark) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Primary meta (GEO/SEO) — baked into raw HTML so crawlers and AI answer
         engines read real content before JavaScript runs. -->
    <title>OpenI Hub — Your innovation team that works while you sleep</title>
    <meta name="description" content="An Innovation Agent for every role: it finds what matters to you every night, checks every match and learns from every click. Free to start." />
    <link rel="canonical" href="https://www.openi.ai/" />

    <!-- Open Graph (link previews on LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenI Hub" />
    <meta property="og:title" content="OpenI Hub — Your innovation team that works while you sleep" />
    <meta property="og:description" content="An Innovation Agent for every role: companies, investors, government, incubators, universities and startups. It checks every match, shows its evidence and learns from every click. 575,000+ startups, 240+ Innovation Maps. ISO 27001 certified. Free to start." />
    <meta property="og:url" content="https://www.openi.ai/" />
    <meta property="og:image" content="https://www.openi.ai/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenI Hub: Your innovation team that works while you sleep. An Innovation Agent for every role." />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenI Hub — Your innovation team that works while you sleep" />
    <meta name="twitter:description" content="An Innovation Agent for every role: companies, investors, government, incubators, universities and startups. It checks every match, shows its evidence and learns from every click. 575,000+ startups, 240+ Innovation Maps. ISO 27001 certified. Free to start." />
    <meta name="twitter:image" content="https://www.openi.ai/og-card.jpg" />
    <meta name="twitter:image:alt" content="OpenI Hub: Your innovation team that works while you sleep. An Innovation Agent for every role." />

    <!-- Structured data — lets AI engines classify OpenI correctly. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OpenI Hub",
      "legalName": "OpenI Partners LLP",
      "url": "https://www.openi.ai",
      "logo": "https://www.openi.ai/openi-logo.png",
      "description": "OpenI Hub gives every role an Innovation Agent: companies, investors, government, incubators, universities and startups. It looks across 575,000+ startups every night, checks every match, shows its evidence and learns from every click. Post challenges and connect directly. ISO/IEC 27001:2022 certified.",
      "sameAs": [
        "https://www.linkedin.com/company/openi-partners/",
        "https://x.com/OpenIPartners"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OpenI Hub",
      "url": "https://www.openi.ai",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "An Innovation Agent for every role in open innovation. It finds and checks startups from 575,000+ every night, ranks them against your priorities with its evidence, and suggests next moves. Search in plain English, evaluate on 8 vectors, post innovation challenges, and connect with corporates, investors, government and academia.",
      "offers": [
        { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "INR" },
        { "@type": "Offer", "name": "Pro", "price": "2499", "priceCurrency": "INR" },
        { "@type": "Offer", "name": "Enterprise", "price": "9999", "priceCurrency": "INR" }
      ],
      "publisher": { "@type": "Organization", "name": "OpenI Partners LLP" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
